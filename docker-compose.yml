services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mozcyber}
      MYSQL_USER: ${DB_USER:-mozcyber}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mozcyber}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3307}:3306"  # permite ao `runserver` local usar a mesma BD
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    env_file: .env
    environment:
      DATABASE_URL: mysql://${DB_USER:-mozcyber}:${DB_PASSWORD:-mozcyber}@db:3306/${DB_NAME:-mozcyber}
    ports:
      - "${WEB_PORT:-8082}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysqldata:
