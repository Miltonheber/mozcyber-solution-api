services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mozcyber}
      POSTGRES_USER: ${POSTGRES_USER:-mozcyber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mozcyber}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      args:
        INSTALL_DEV: ${INSTALL_DEV:-true}
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-mozcyber}:${POSTGRES_PASSWORD:-mozcyber}@db:5432/${POSTGRES_DB:-mozcyber}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
